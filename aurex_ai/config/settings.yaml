# ============================================================
# Aurex AI Signature Strategy — Master Configuration
# All runtime parameters live here.  No hardcoded values in code.
# ============================================================

# ── Trading symbols ───────────────────────────────────────────
# Use full broker symbol names as displayed in MT5 Market Watch.
# HFM Premium appends .Z to all FX pairs.
# Change broker_suffix to match your broker (e.g. ".m", ".pro", ".ecn", "").
broker_suffix: ".Z"

symbols:
  # Phase 8: Focused 5-symbol institutional set.
  # Gold must use XAUUSD (NO .Z suffix — stripped by NO_SUFFIX_SYMBOLS guard).
  # Forex pairs use the broker suffix configured in broker_suffix above.
  # Removed low-ATR pairs (AUDUSD, USDCAD, NZDUSD, USDCHF) — insufficient edge.
  # Added GBPJPY.Z — highest ATR cross; institutional order flow pairs only.
  - XAUUSD     # Gold — NO .Z suffix. Highest ATR. Strictest confidence gate.
  - EURUSD.Z   # Deepest FX liquidity — trend continuation + sweep setups
  - GBPUSD.Z   # High ATR, strong institutional flow — London session leader
  - USDJPY.Z   # Risk-on/risk-off gauge; carry pair with strong directional bias
  - GBPJPY.Z   # Highest ATR cross; institutional order flow and momentum

# ── Risk management ───────────────────────────────────────────
risk:
  risk_pct:            1.0     # % of balance risked per trade (target; floored at vol_min lot)
  min_rr:              2.0     # minimum RR — TP is always ATR×3.0/SL×1.5 = 2.0; floor ensures this
  max_open_trades:     5       # Phase 9: 5 simultaneous trades max — multi-symbol institutional scaling
                               # Per-symbol cap (max_open_per_symbol) prevents stacking same pair.
                               # Correlation section disabled when max_open_trades>=3.
  max_open_per_symbol: 2       # max concurrent positions per individual symbol (same pair cap)
  max_daily_trades:    10      # institutional discipline: up to 10 trades per day across 5 symbols
  max_lot_size:        0.05    # safety cap — 0.0 means no cap
  max_daily_loss_pct:  8.0     # halt at 8% daily DD (tighter than 10% — protect capital)
  max_trade_risk_pct:  15.0    # survivability cap: micro-account floor.
                               # On R500 the minimum lot (0.01) already costs ~7-10% per trade
                               # depending on SL distance — 5% is mathematically unreachable.
                               # 15% allows minimum-lot trades while blocking runaway exposure.
  fixed_lot_size:      0.0     # 0.0 = dynamic sizing (recommended). Dynamic sizing respects
                               # risk_pct, size_mult (tier/quality), and grows with balance.
                               # On R500 lots will floor at volume_min (0.01) regardless —
                               # dynamic mode still applies composite quality multipliers.
                               # Set > 0 only for hard-fixed lot (disables all dynamic sizing).
  max_sl_pips:         100     # SL cap raised to 100 for XAUUSD and GBPJPY.Z compatibility.
                               # Gold M15 ATR×1.5 ≈ 15-75 pips (0.1 pip); GBPJPY ≈ 60-120 pips.
                               # Dollar risk is controlled by max_trade_risk_pct not pip count.
                               # Set to 0 to disable.
  min_execution_tier:  2       # minimum tier allowed to execute.
                               # 1 = Tier 1 only (score ≥ 60)
                               # 2 = Tier 1 + Tier 2 (score ≥ 50)  ← recommended for small account
                               # 3 = all tiers including Tier 3 and fallback
                               # Tier 3 / fallback (0.25× lot) add frequency with no quality edge.
  sl_buffer_pips:      5       # extra buffer beyond sweep level for SL
  tp_fixed_rr:         2.5     # legacy parameter (TP set by tp_atr_mult in strategy section)

# ── Scoring weights (must sum to 100) ─────────────────────────
scoring:
  weights:
    trend:        30   # +5: primary signal, present across all sessions
    liquidity:    25   # +5: sweep is the most reliable live edge
    fvg:          10   # -10: valuable in London/NY but structurally absent in Asian session
    fibonacci:    15   # unchanged
    ema:          10   # unchanged
    confirmation: 10   # unchanged
  thresholds:
    tier1:        60   # score >= tier1  → EXECUTE   (1.00× lot)
    tier2:        50   # score >= tier2  → CONDITIONAL (0.50× lot)
    tier3:        35   # score >= tier3  → TIER3     (0.25× lot)  was 40
    # score < tier3 → SKIP
  min_confidence:  50  # pre-filter floor: reject markets below 50 confidence score

# ── Timeframes ────────────────────────────────────────────────
timeframes:
  h4_candles:  210    # H4 bars fetched (EMA200 warmup needs ≥205)
  h1_candles:  250    # H1 bars fetched
  m15_candles: 150    # M15 bars for entry analysis
  m5_candles:  100    # M5 bars (optional precision entry)

# ── Cooldown system ───────────────────────────────────────────
cooldown:
  trending_minutes:    15    # cooldown when market is trending
  ranging_minutes:     60    # cooldown when market is ranging / low confluence
  post_loss_minutes:   60    # extended cooldown after a losing trade
  post_win_minutes:    15    # shortened cooldown — good setups appear quickly; was 20

# ── Strategy parameters ───────────────────────────────────────
strategy:
  # Trend detection
  ema_fast_period:  50     # EMA 50 — structure
  ema_slow_period:  200    # EMA 200 — macro trend

  # EMA entry zone
  ema_entry_period:      21    # EMA 21 — entry proximity scoring
  ema_entry_threshold_pct: 0.50  # price within 0.50% of EMA21 → full score

  # Liquidity sweep
  swing_window:          3     # bars each side to define a swing high/low
  sweep_lookback:        50    # bars to scan for sweep event
  equal_tol_pips:        3     # pip tolerance for "equal" highs/lows
  min_wick_ratio:        0.40  # wick must be ≥40% of candle range (Phase 2: relaxed from 0.55)

  # Core score minimum (applied before bonus factors count)
  # Prevents setups where OB/breakout/structure bonuses inflate a weak core past execution thresholds.
  # core_score = trend + liquidity + fvg + fib + ema + confirmation (0-100, no bonuses)
  min_core_score:        35    # trades with core < 35 are rejected regardless of bonus score

  # ATR-based SL/TP multipliers (used by risk_manager.calculate)
  sl_atr_mult: 1.5    # SL = entry ± ATR(14) × this (1.5 ATR covers ~95% of normal moves)
  tp_atr_mult: 0.0    # 0 = use dynamic RR (Phase 5). Set >0 to override with fixed multiplier.

  # Phase 5: Dynamic RR targeting — realistic TP for better hit frequency
  # Standard setups: 1.5R TP.  Tier1+TRENDING+conf≥65: 2.0R max.
  # Exceeding 2.0R is not allowed — wider TP dramatically reduces hit probability.
  tp_rr_standard:    1.5   # RR target for Tier 2 and general Tier 1 setups
  tp_rr_high_conf:   2.0   # RR target for confirmed Tier 1 + TRENDING + conf≥65

  # Phase 5: Entry timing — candle exhaustion and EMA overextension detection
  max_ema21_ext_atr:       2.5    # flag overextension if price > 2.5 ATR from EMA21
  candle_exhaust_wick_min: 0.65   # wick-to-range ratio indicating exhaustion candle

  # Signal strength gate (fallback pipeline only)
  strength_threshold:    0.60  # minimum signal strength; raised by AI optimizer on losses

  min_atr_pips:          10    # ATR < min → HARD REJECT (sleeping market).
                               # Conservative reference value; aggressive mode overrides to 5.0.
                               # 10 pips suits conservative mode (only trade strong volatility).
                               # 5 pips is the dead-market absolute floor for all major pairs.
  atr_optimal_max_pips:  30    # ATR > this = HIGH zone. Conservative: block.
                               # Aggressive: existing max_atr_pips proportional reduction.
                               # 30 pips covers normal London/NY range; above = news/spike.
  max_atr_pips:         200    # ATR > max → proportional reduction (max/atr factor)

  # Fair Value Gap
  fvg_lookback:          50
  fvg_min_size_pips:     1.0   # minimum gap size to qualify

  # Fibonacci
  fib_lookback:          50
  fib_min_move_pips:     20    # minimum impulse move to compute fib (lowered from 30 — Phase 3)
  fib_ratios:            [0.382, 0.5, 0.618, 0.705, 0.786]
  golden_zone:           [0.5, 0.705]

# ── MT5 connection ────────────────────────────────────────────
mt5:
  path:      ""           # path to terminal64.exe, empty = auto-detect
  account:   0            # broker account number — MUST set in env or .env
  password:  ""           # MUST set in env or .env
  server:    ""           # broker server name
  magic:     202500
  deviation: 20           # max slippage in points
  timeout:   10           # operation timeout in seconds
  max_retries:   5
  retry_delay:   2.0      # seconds between retries

# ── Trading mode ──────────────────────────────────────────────
trading:
  dry_run:        false   # LIVE — real orders sent to MT5
  scan_interval:  15      # seconds between full symbol scans
  environment:    production
  sim_balance:    0.0     # DISABLED — real MT5 account balance used for all calculations.
  # "aggressive" — tuned for small accounts ($29/R500): lower thresholds, higher frequency
  # "conservative" — original production gates: use when scaling to larger capital
  trading_mode:   normal    # Phase 8: institutional "normal" mode — stricter than aggressive

# ── Logging ───────────────────────────────────────────────────
logging:
  level:        INFO
  debug:        false      # true → DEBUG level, logs every symbol + decision detail
  dir:          ./logs
  max_bytes:    10485760   # 10 MB
  backup_count: 10

# ── Fallback strategy ─────────────────────────────────────────
fallback:
  enabled:            false   # LIVE CAPITAL PROTECTION: fallback (Tier 3) disabled
  # FORCE_FALLBACK — set true to bypass idle threshold (TEST/DEBUG mode only)
  # WARNING: forces a fallback attempt every cycle. Never use in production.
  force_trigger:      false
  # Idle cycles before fallback activates
  idle_cycles_normal: 8       # asian session or low ATR
  idle_cycles_active: 5       # London/NY session with ATR >= min_atr_pips
  # Daily limit — resets at UTC midnight
  max_daily_trades:   2
  # Market quality filters
  min_atr_pips:       8.0     # minimum ATR to enter (below = flat/dead market)
  max_spread_pips:    3.0     # maximum allowed spread in pips
  min_strength:       0.35    # minimum signal strength (fallback max is 0.50)

# ── Stack entries ─────────────────────────────────────────────
stack:
  enabled:            true
  min_confidence:     70      # minimum AI confidence to stack
  pullback_min_atr:   0.2     # pullback must be >= this many ATR from recent swing
  pullback_max_atr:   0.4     # pullback must be <= this many ATR from recent swing
  body_ratio:         0.6     # minimum body/range ratio for momentum confirmation

# ── Backtest ──────────────────────────────────────────────────
backtest:
  data_dir:         ./data/backtest    # root for CSV historical data
  commission_pips:  0.5               # simulated commission per trade
  slippage_pips:    0.5               # simulated slippage on fill
  account_currency: ZAR               # account currency for backtest reports

# ── Trade management ──────────────────────────────────────────
trade_management:
  breakeven_enabled:  true    # move SL to entry at +1R
  partial_tp_enabled: true    # close partial_tp_ratio of position at +1R
  partial_tp_ratio:   0.45    # 45% closed at 1R; 55% stays for the runner — was 0.5
  breakeven_rr:       1.0     # R-multiple that triggers both actions
  trail_1r5_rr:       1.5     # start trailing at +1.5R (ATR × trail_atr_mult_1)
  trail_2r_rr:        2.0     # tighten trail at +2R   (ATR × trail_atr_mult_2)
  trail_atr_mult_1:   1.0     # first trail stage multiplier
  trail_atr_mult_2:   0.4     # tighter trail at 2R — lock in more profit; was 0.5
  # Phase 5: Runner momentum decay protection
  momentum_decay_trail_mult: 0.30   # ultra-tight trail when EMA slope reverses
  momentum_ema_period:       9      # M15 EMA period for slope detection
  momentum_check_enabled:    true   # enable momentum decay monitoring for runners

# ── Account Guard (Phase 1: Risk Stabilization) ───────────────
guard:
  consecutive_loss_halt:   3       # halt all trading after N consecutive losses (resets next UTC day)
  consecutive_loss_reduce: 2       # reduce lot size to 50% at N consecutive losses
  daily_dd_halt_pct:       5.0     # Phase 8: 5% max daily drawdown — matches institutional requirement
  daily_dd_reduce_pct:     2.5     # reduce to 50% lot when daily DD reaches this %
  total_dd_halt_pct:       15.0    # Phase 8: 15% max account drawdown from peak — safer ceiling
  small_account_balance:   2000.0  # ZAR balance below which small-account conservative limits apply

# ── Testing ───────────────────────────────────────────────────
testing:
  test_mode: false              # MUST remain false in production
  high_frequency_mode: false    # LIVE CAPITAL PROTECTION: enforce all daily trade limits

# ── Session management ────────────────────────────────────────
session:
  # London-NY overlap (13:00-15:59 UTC) data shows 0% win rate and -116 ZAR loss
  # across 4 trades. This 3-hour window sees US news events (13:30 UTC), London
  # position unwinding, and directional confusion as NY tries to establish trend.
  # Result: false breakouts, wide spreads, whipsaw action.
  block_overlap:        true   # block all new entries 13:00–15:59 UTC
  overlap_start_hour:   13     # inclusive
  overlap_end_hour:     16     # exclusive (16:00 = first allowed NY pure hour)
  # Phase 5: Session quality multipliers (size penalties)
  london_quality:       1.00   # full participation 07-13 UTC (highest institutional flow)
  newyork_quality:      0.90   # slight reduction 16-21 UTC (post-overlap lower liquidity)
  # [Phase 7] Session intelligence: confidence threshold adjustments
  # Raises the bar during statistically weaker periods.
  # London core (09-13 UTC): prime institutional window — no adjustment (base threshold)
  # London open (07-09 UTC): spreads wide, volatility spiking — +3 confidence required
  # NY pure   (16-21 UTC): lower liquidity, more choppy — +4 confidence required
  london_open_conf_penalty:  3    # extra confidence pts required 07:00-08:59 UTC
  newyork_conf_penalty:      4    # extra confidence pts required 16:00-20:59 UTC

# ── Per-symbol minimum confidence thresholds [Phase 8] ───────────────────────
# Applied on top of mode.min_confidence. The stricter value wins.
# Only the 5 active institutional symbols are listed.
# Gold strictest: extreme ATR + frequent false breaks demand highest gate.
# High-ATR FX pairs carry elevated noise — stricter threshold required.
per_symbol:
  XAUUSD:   72    # Gold — strictest gate; extreme volatility and false breakouts
  GBPJPY:   68    # Highest ATR cross — hardest directional predictability
  GBPUSD:   68    # High-ATR GBP cable — wide spreads, London-dominated
  USDJPY:   66    # Yen carry pair — risk-on/off driven; needs macro alignment
  EURUSD:   66    # Deepest liquidity — still needs strong institutional signal

# ── Trading mode gate presets ─────────────────────────────────
# These override the individual strategy/risk/scoring values at runtime.
# Switch via: trading.trading_mode = aggressive | conservative
#
# aggressive — designed for small accounts ($29/R500):
#   • ATR floor 5 pips (dead-market absolute floor = 3 pips)
#   • Rebalanced weights: trend heavier, liquidity/FVG lighter
#     so absent sweeps/FVGs do not crater the score
#   • Lower tier thresholds: more setups qualify, lower quality floor
#   • All three tiers executable (tier3 = 0.25× lot)
#   • Execution composite 0.25 (was 0.40) — still blocks doji-only entries
#   • Structure fallback: strong trend earns 5-pt continuation credit
#
# conservative — original production calibration:
#   • ATR floor 10 pips
#   • AI-adaptive weights (learning engine self-tunes via trade outcomes)
#   • Original tier thresholds (60/50/35)
#   • Tier 1+2 only (tier3 blocked)

modes:
  normal:
    # ── Institutional Normal: 5-symbol focused set (Phase 8) ─────────────────
    # "Normal" sits between aggressive and conservative.
    # Higher quality gate than aggressive; more adaptive than conservative.
    # Confidence floor is 68 (forex) — well above retail noise level.
    # Gold handled separately via per_symbol.XAUUSD=72.
    # Tier 1 requires a genuinely strong institutional setup (score ≥72).
    # Tier 2 allows solid but sub-elite setups (score ≥65) at half lot.
    # Tier 3 blocked — only institutional quality executes.
    min_confidence:       68     # base forex confidence floor (gold uses per_symbol=72)
    min_atr_pips:         6.0    # minimum volatility — below this is a dead market
    atr_optimal_max_pips: 30     # above 30 pips = news/spike territory — size-reduce
    min_core_score:       42.0   # core must clear 42 before bonuses count
    min_execution_tier:   2      # Tier 1+2 only; Tier 3 (0.25× lot) blocked
    tier1:                72     # A+ setup: full institutional confluence required
    tier2:                65     # B+ setup: solid but not elite; half lot
    tier3:                52     # blocked by min_execution_tier=2 anyway
    weights:
      # Trend continuation + pullback focus (same as aggressive but with FX-biased balance).
      # A trend+sweep+FVG setup scores ~86; trend+fib+ema scores ~68 (Tier 2 eligible).
      # Strong BUY setups need sweep OR FVG confirmation — SELL slightly more lenient.
      trend:        38   # primary driver — directional bias is the strongest edge
      liquidity:    20   # sweep confirms institutional entry; secondary to trend
      fvg:           8   # valid in London/NY; secondary to pullback structure
      fibonacci:    18   # elevated — golden zone pullback is core entry signal
      ema:          12   # elevated — EMA proximity is the continuation entry zone
      confirmation:  4   # candle pattern confirms, doesn't lead

  aggressive:
    # ── Quality-Aggressive: small account survivability (R500/$30) ────────────
    # "Aggressive" = aggressive filtering, NOT aggressive entry frequency.
    # Phase 7: All thresholds raised — only genuinely institutional setups execute.
    # Fewer trades, higher quality, better drawdown control.
    # Tier 3 disabled. Session gate enforced at pipeline level.
    min_confidence:      62     # [Phase 7] institutional market-readiness floor (was 52)
    min_atr_pips:        5.0    # 5 pips is the dead-market absolute floor
    atr_optimal_max_pips: 35    # cap high-volatility ceiling (news/spike protection)
    min_core_score:      38.0   # [Phase 7] requires trend + at least two institutional factors (was 35)
    min_execution_tier:  2      # TIER 3 ELIMINATED (0.25× lot, no quality edge)
    tier1:               70     # [Phase 7] A+ setups only for full lot execution (was 65)
    tier2:               62     # [Phase 7] B+ setups for half lot — must pass confidence gate first (was 52)
    tier3:               48     # blocked by min_execution_tier=2 anyway
    weights:
      # Phase 3: trend continuation + pullback system — trend, EMA, Fib dominate.
      # Liquidity reduced (still valuable but doesn't need to dominate).
      # A strong trend + sweep + FVG setup scores ~88; trend+fib+ema scores ~69 (Tier 1).
      # Sum = 100.
      trend:        38   # primary driver — directional bias is the strongest edge
      liquidity:    18   # sweep confirms entry but isn't required for continuation
      fvg:           8   # valid in London/NY but secondary to pullback structure
      fibonacci:    16   # elevated — pullback to golden zone is the core entry signal
      ema:          16   # elevated — EMA proximity is the continuation entry zone
      confirmation:  4   # candle pattern confirms but doesn't lead; reduced weight

  conservative:
    min_confidence:      60     # [Phase 7] raised from 50
    min_atr_pips:       10.0
    atr_optimal_max_pips: 25   # HIGH zone above 25 pips: block (news/spike risk)
    min_core_score:     38.0   # [Phase 7] raised from 35
    min_execution_tier:  2
    tier1:               68     # [Phase 7] raised from 60
    tier2:               60     # [Phase 7] raised from 50
    tier3:               48     # blocked by min_execution_tier=2 anyway
    # weights: omitted → learning engine provides adaptive weights

# ── Correlation / currency exposure protection (Phase 8) ─────────────────────
# Prevents simultaneous trades that double-up on the same currency side.
# Phase 9: DISABLED — limits of 1 are incompatible with max_open_trades=5.
# Per-symbol cap (max_open_per_symbol=2) already prevents stacking the same pair.
# Re-enable with higher limits if you want stricter cross-currency diversification.
#   max_usd_longs  — max open positions that are net long USD
#   max_usd_shorts — max open positions that are net short USD
#   max_gbp_exposure — max concurrent GBP positions (GBPUSD + GBPJPY)
#   max_jpy_exposure — max concurrent JPY positions (USDJPY + GBPJPY)
correlation:
  enabled:           false   # Phase 9: disabled — incompatible with 5-trade scaling
  max_usd_longs:     3    # allow 3 USD-long positions (if re-enabled)
  max_usd_shorts:    3    # allow 3 USD-short positions (if re-enabled)
  max_gbp_exposure:  2    # allow 2 concurrent GBP positions (if re-enabled)
  max_jpy_exposure:  2    # allow 2 concurrent JPY positions (if re-enabled)

# ── Spread control (Phase 5) ──────────────────────────────────────────────────
# Early spread/ATR ratio check before running the full confluence pipeline.
# Prevents entries during rollover, news, or symbol-specific spread spikes.
# A supplementary check — the existing post-risk spread filter still runs.
spread:
  max_ratio:    0.20    # spread/ATR > this → size reduced to 60-80%
  block_ratio:  0.35    # spread/ATR > this → execution blocked entirely

# ── News protection (Phase 5 + Phase 7) ──────────────────────────────────────
# Lightweight protection against high-impact economic releases.
# No external API required — uses deterministic UTC time patterns.
news:
  avoid_nfp:         true    # block NFP window (1st Friday, 13:30 UTC ±window)
  nfp_window_pre:    20      # [Phase 7] minutes before NFP — extended from 15
  nfp_window_post:   45      # [Phase 7] minutes after NFP recovery — extended from 30
  avoid_fomc:        true    # reduce size Wednesday 17:45–20:00 UTC (FOMC risk)
  fomc_size_mult:    0.50    # lot multiplier during FOMC risk window
  avoid_rollover:    false   # rollover is outside session gate — redundant but available
  news_size_mult:    0.50    # generic fallback size reduction during news events
  # [Phase 7] US CPI — 2nd Tuesday of each month, 13:30 UTC
  avoid_cpi:         true    # block CPI release window
  cpi_window_pre:    20      # minutes before CPI release
  cpi_window_post:   45      # minutes after CPI release before resuming
  # [Phase 7] Central bank rate decisions — BOE/ECB typically Thursdays
  avoid_rate_day:    true    # reduce size during Thursday rate-decision window
  rate_day_size_mult: 0.60   # lot multiplier on rate decision days
  rate_day_start_hm:  660    # 11:00 UTC in minutes (660 = 11×60)
  rate_day_end_hm:    810    # 13:30 UTC in minutes (810 = 13×60+30)

# ── Phase 6: AI Adaptive Learning ────────────────────────────────────────────
# Controls the AdaptiveLearning engine's rolling-window analysis and
# confidence modifier generation.  Bounded to prevent over-fitting.
adaptive_learning:
  rolling_window_short:   20    # recent trades for short-term factor analysis
  rolling_window_long:    100   # extended window for trend confirmation
  symbol_modifier_min:    0.70  # floor: worst-performing symbols get 0.70× confidence
  symbol_modifier_max:    1.00  # ceiling: no symbol gets more than 1.00× boost
  session_modifier_min:   0.75  # floor for session-based confidence modifier
  min_trades_for_modifier: 15   # minimum trades before symbol/session modifier activates
  drift_guard_pct:        15    # max % deviation from baseline weights before rollback

# ── Phase 6: Execution Quality ────────────────────────────────────────────────
# Monitors fill quality and degrades trading during poor broker conditions.
execution_quality:
  slippage_warn_pips:     2.0   # log [SLIPPAGE DETECTED] above this
  slippage_block_pips:    5.0   # refuse future trades if avg slippage exceeds this
  spread_spike_ratio:     2.5   # spread > N× symbol avg → [SPREAD INSTABILITY]
  quality_window:         20    # trades in rolling quality window
  min_quality_score:      40    # quality score below this → [EXECUTION HEALTH] warning

# ── Phase 6: Failsafe & Recovery ─────────────────────────────────────────────
failsafe:
  stale_candle_threshold: 3     # same candle repeated N times → [FAILSAFE] stale data
  duplicate_window_sec:   30    # window to detect duplicate ticket submissions
  mt5_reconnect_attempts: 3     # auto-reconnect tries before raising [RECOVERY ACTIVE]
  max_cycle_duration_sec: 90    # scan cycle > this → [LATENCY WARNING]
  execution_lock_timeout: 10    # per-symbol lock timeout (seconds)

# ── Phase 6: Enterprise Telemetry ────────────────────────────────────────────
telemetry:
  heartbeat_interval_cycles: 1    # emit [ENTERPRISE HEARTBEAT] every N cycles
  memory_warn_mb:             500  # [VPS STATUS] warning above this RSS MB
  cycle_warn_sec:             60   # [LATENCY WARNING] if cycle exceeds this
  health_score_window:        10   # cycles used to compute rolling health score

